name: Reproduce published v4 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install exact dependencies with wheel hashes
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify package, regenerate intervals, and reconstruct exact witnesses
        run: python -B tools/run_checks.py --suite all --output results/current
      - name: Preserve actual run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: results/current/
          if-no-files-found: error
          retention-days: 90
